<!DOCTYPE html>
<html>
<head>
  <title>Review Intelligence</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; }
    textarea { width: 100%; height: 100px; font-size: 16px; padding: 10px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Product Review Intelligence</h2>
  <p>Type a product review below to see its sentiment and detected issues.</p>
  <textarea id="reviewInput" placeholder="e.g. The box arrived damaged and the item stopped working after a week."></textarea>
  <br>
  <button onclick="analyzeReview()">Analyze</button>
  <div id="result"></div>

  <script>
    async function analyzeReview() {
      const review = document.getElementById("reviewInput").value;
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = "Analyzing...";

      try {
        const response = await fetch("http://127.0.0.1:8000/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ review: review })
        });
        const data = await response.json();
        resultDiv.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultDiv.textContent = "Error: could not reach the backend. Is it running?";
      }
    }
  </script>
</body>
</html>
